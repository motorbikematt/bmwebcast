<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Live Webcast</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, Helvetica, sans-serif;
    background-color: #111;
    color: #fff;
    position: relative;
    overflow: hidden;
  }
  .bg-art {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    max-width: 90vw;
    max-height: 90vh;
    filter: invert(1);
    opacity: 0.6;
    pointer-events: none;
  }
  h1 {
    position: relative;
    font-size: 2rem;
    font-weight: normal;
    text-shadow: 0 0 20px #111, 0 0 20px #111, 0 0 20px #111;
  }
</style>
</head>
<body>
  <img class="bg-art" src="bg-composite.png" alt="">
  <h1>Coming soon</h1>
</body>
</html>
